# 从源码构建本地镜像（开发者 / 需要改代码时用）：
#   docker compose -f docker-compose.build.yml up -d --build
# 构建出的镜像只在本机生效（wb-proxy:local），不会覆盖从 GHCR 拉取的镜像；
# 端口、环境变量与挂载目录和 docker-compose.yml 保持一致，改动时两个文件一起改。
services:
  wb-proxy:
    build: .
    image: wb-proxy:local
    container_name: wb-proxy
    restart: unless-stopped
    ports:
      # 左侧宿主端口可自选；右侧是容器内监听端口，必须与下面的 PORT 一致
      - "8788:8788"
    environment:
      - HOST=0.0.0.0
      - PORT=8788
      # - API_KEY=your_api_key_here
      - TZ=Asia/Shanghai
    volumes:
      - ./accounts:/app/accounts
      - ./usage:/app/usage
