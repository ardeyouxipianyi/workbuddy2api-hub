services:
  wb-proxy:
    build: .
    image: ardeyouxipianyi/workbuddy2api-hub:latest
    container_name: wb-proxy
    restart: unless-stopped
    # Defaults to root (0:0), i.e. the historical behaviour. To run as your own
    # host user instead, set PUID/PGID (e.g. PUID=$(id -u) PGID=$(id -g)
    # docker compose up -d) and make sure ./accounts and ./usage are writable
    # by that uid; see the README's Docker section (M6 F3).
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      # 左侧宿主端口可自选；右侧是容器内监听端口，必须与下面的 PORT 一致
      - "8788:8788"
    environment:
      - HOST=0.0.0.0
      - PORT=8788
      # 留空则容器启动时自动生成 API Key（写入 ./accounts/settings.json，并打印在启动日志）；
      # 想自己指定就取消下面这行注释并填上。
      # - API_KEY=your_api_key_here
      - TZ=Asia/Shanghai
    volumes:
      # 持久化挂载账号凭证与用量流水
      - ./accounts:/app/accounts
      - ./usage:/app/usage
