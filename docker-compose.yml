# 部署与更新（推荐）：直接拉取 GHCR 上的预编译镜像，无需克隆仓库、无需本地构建。
#
#   首次部署：docker compose up -d
#   更新版本：docker compose pull && docker compose up -d
#   查看日志：docker compose logs -f
#
# 从源码构建（开发者）请改用：docker compose -f docker-compose.build.yml up -d --build
services:
  wb-proxy:
    # 追最新稳定版用 :latest；想固定版本就换成具体版本号（如 :v1.6.11），升级前改这一行
    image: ghcr.io/ardeyouxipianyi/workbuddy2api-hub:latest
    container_name: wb-proxy
    restart: unless-stopped
    ports:
      # 左侧宿主端口可自选；右侧是容器内监听端口，必须与下面的 PORT 一致
      - "8788:8788"
    environment:
      - HOST=0.0.0.0
      - PORT=8788
      # 留空则容器启动时自动生成 API Key（写入 ./accounts/settings.json，并打印在启动日志）；
      # 想自己指定就取消下面这行注释并填上。
      # - API_KEY=your_api_key_here
      - TZ=Asia/Shanghai
    volumes:
      # 持久化挂载账号凭证与用量流水（更新镜像不会动这两个目录）
      - ./accounts:/app/accounts
      - ./usage:/app/usage
