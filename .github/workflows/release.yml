name: release

# Tag-triggered release packaging (issue #28).
#
#   push vX.Y.Z  ->  version gate  ->  full test matrix  ->  ZIP + .ipk + .apk
#                                                         ->  SHA256SUMS
#                                                         ->  DRAFT release
#
# The release is only ever created/updated as a draft: the maintainer edits the
# version notes above the generated "下载说明" block and clicks Publish. Nothing
# in this workflow can publish it.
#
# Two things this workflow refuses to guess:
#
#   * The portable asset is the *green* package, so it carries the trimmed
#     CPython runtime the launchers look for (python\python.exe). CI cannot
#     rebuild that runtime from the repository, so it is a pinned, checksummed
#     release input (release/portable_runtime.py) and the package is built and
#     booted on Windows - a Linux-built ZIP could only ever be a source archive.
#
#   * Every path that writes a release requires the *whole* existing matrix
#     (the legs are read from tests.yml, so adding one widens the gate) to have
#     passed for the target commit. A reduced single-OS run is only allowed for
#     a packaging-only dry run, and that path never touches a release.
#
# A tag carrying the repository's existing `-ci` rehearsal suffix goes through
# exactly the same path, but the draft is also marked prerelease, so a rehearsal
# release can never be picked up by the updater planned in #29 (it ignores
# prereleases).
#
# A manual run cannot write a release at all. `workflow_dispatch` is
# packaging-only: it builds and hashes exactly what a tag push would, prints the
# commands that would follow, and stops. The release writer lives in its own job
# whose `if:` is the one condition below, so no input combination can reach it -
# tests/_test_release_assets.py pins that, including a self-test proving the
# check fails when a writer is moved onto the dispatch path.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（手动运行只做打包演练，不创建/更新任何 release）"
        required: true

permissions:
  contents: write

# A release must not be built twice at once, and an in-flight run is worth
# finishing (it is about to upload assets), so unlike tests.yml this one does
# not cancel.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
  CHECKOUT_REF: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
  # Belt and braces next to the scripts' own reconfigure: every Python process
  # in the job reads and writes utf-8 whatever the runner locale is. The
  # Windows runner's console is cp1252, which is what killed the first
  # rehearsal at the first Chinese summary line.
  PYTHONUTF8: "1"
  # OpenWrt 25.x apk-tools package: needs the SDK because `apk mkpkg` ships in
  # it. The tarball is cached, so only the first run pays for the download.
  SDK_TARBALL: openwrt-sdk-25.12.2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  SDK_REL: "25.12.2"

jobs:
  # ---- 1. tag == source version -------------------------------------------
  # Same assertion tests.yml makes, repeated here because the release must not
  # depend on another workflow's file staying shaped the way it is today.
  version:
    name: tag matches source version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      rehearsal: ${{ steps.v.outputs.rehearsal }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Assert tag == source version
        id: v
        run: |
          set -euo pipefail
          OVERVIEW=$(grep -oP '"version"\s*:\s*"\K[^"]+' wb_proxy.py | head -n1 || true)
          SERVER=$(grep -oP 'server_version\s*=\s*"wb-proxy/\K[^"]+' wb_proxy.py | head -n1 || true)
          echo "source: overview=$OVERVIEW server=$SERVER tag=$TAG"
          if [ -z "$OVERVIEW" ] || [ "$OVERVIEW" != "$SERVER" ]; then
            echo "::error::source version strings disagree ($OVERVIEW vs $SERVER)"
            exit 1
          fi
          REHEARSAL=false
          TAGVER="${TAG#v}"
          if [[ "$TAG" == *-ci ]]; then
            REHEARSAL=true
            echo "rehearsal tag (-ci): skipping tag==version assertion (source=$OVERVIEW)"
          elif [ "$TAGVER" != "$OVERVIEW" ]; then
            echo "::error::tag $TAG != source version $OVERVIEW (bump the source first)"
            exit 1
          fi
          # The OpenWrt recipe carries the same version in its package Makefile
          # and is the third place that has to agree, so check it here instead
          # of discovering the mismatch inside the SDK build.
          PKGVER=$(sed -n 's/^PKG_VERSION:=//p' wrt/openwrt/workbuddy2api/Makefile | head -n1)
          PKGREL=$(sed -n 's/^PKG_RELEASE:=//p' wrt/openwrt/workbuddy2api/Makefile | head -n1)
          if [ "$PKGVER" != "$OVERVIEW" ]; then
            echo "::error::wrt Makefile PKG_VERSION=$PKGVER != source version $OVERVIEW"
            echo "        bump PKG_VERSION in wrt/openwrt/workbuddy2api/Makefile"
            exit 1
          fi
          echo "version=$OVERVIEW" >> "$GITHUB_OUTPUT"
          echo "release=$PKGREL" >> "$GITHUB_OUTPUT"
          echo "rehearsal=$REHEARSAL" >> "$GITHUB_OUTPUT"
          echo "version assert OK: $TAGVER (pkg release $PKGREL)"

  # ---- 2. the gate every release-writing path must pass --------------------
  gate:
    name: required tests
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      # Set by the step that actually checks every leg, not by `decide`: an
      # output wired to the wrong step is empty, and the draft job then refuses
      # the write - which is how this was caught the first time it ran.
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Decide what this run is allowed to do
        id: decide
        run: |
          set -euo pipefail
          WRITES=false
          case "${{ github.event_name }}:${{ github.ref }}" in
            push:refs/tags/v*) WRITES=true ;;
          esac
          echo "writes=$WRITES" >> "$GITHUB_OUTPUT"
          if [ "$WRITES" = "true" ]; then
            echo "v* tag 推送：必须先拿到完整矩阵，之后才允许写 Draft Release"
          else
            echo "手动运行：packaging-only，任何输入都不会写 release，单 OS 跑一遍套件即可"
          fi
      - name: Require the full matrix for this commit
        # Only a full matrix may authorise a release mutation. The legs come
        # from tests.yml, so a leg dropped there cannot silently weaken this.
        id: matrix
        if: steps.decide.outputs.writes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          mapfile -t EXPECTED < <(python release/matrix_legs.py)
          if [ "${#EXPECTED[@]}" -eq 0 ]; then
            echo "::error::解析不出 tests.yml 的测试矩阵，拒绝授权发布"
            exit 1
          fi
          echo "目标提交 $SHA 上必须这些腿全部通过："
          printf '  - %s\n' "${EXPECTED[@]}"

          WF=$(gh api "/repos/$GH_REPO/actions/workflows" \
                 --jq '.workflows[] | select(.path == ".github/workflows/tests.yml") | .id')
          [ -n "$WF" ] || { echo "::error::找不到 tests.yml 工作流"; exit 1; }

          # The tag push starts both workflows at once, so the run may not be
          # visible yet; wait for it before waiting on it.
          RUN=""
          for _ in $(seq 1 30); do
            RUN=$(gh api "/repos/$GH_REPO/actions/workflows/$WF/runs?head_sha=$SHA&per_page=50" \
                    --jq '[.workflow_runs[] | select(.event == "push" or .event == "pull_request")]
                          | sort_by(.created_at) | reverse | .[0].id // ""')
            [ -n "$RUN" ] && break
            sleep 10
          done
          [ -n "$RUN" ] || { echo "::error::提交 $SHA 上没有 tests 运行（tag/PR 未触发测试？）"; exit 1; }
          echo "waiting on run $RUN"

          STATUS=timeout
          for _ in $(seq 1 150); do
            read -r STATUS CONCLUSION <<<"$(gh api "/repos/$GH_REPO/actions/runs/$RUN" \
                 --jq '"\(.status) \(.conclusion // "-")"')"
            case "$STATUS $CONCLUSION" in
              "completed success") break ;;
              "completed "*)
                echo "::error::必需的测试没有通过（conclusion=$CONCLUSION）"
                exit 1 ;;
            esac
            sleep 20
          done
          [ "$STATUS" = "completed" ] || { echo "::error::等待 tests 运行超时"; exit 1; }

          # The workflow conclusion alone is not enough: check every leg by
          # name, so a matrix that lost a leg cannot pass this gate.
          gh api "/repos/$GH_REPO/actions/runs/$RUN/jobs?per_page=100" \
            --jq '.jobs[] | "\(.name)\t\(.conclusion)"' > jobs.tsv
          cat jobs.tsv
          MISSING=0
          for leg in "${EXPECTED[@]}"; do
            if awk -F'\t' -v n="$leg" '$1 == n && $2 == "success" { found = 1 } END { exit !found }' jobs.tsv; then
              echo "  ok   $leg"
            else
              echo "::error::矩阵腿没有在 $SHA 上通过：$leg"
              MISSING=1
            fi
          done
          [ "$MISSING" = "0" ] || exit 1
          echo "matrix=full" >> "$GITHUB_OUTPUT"
          echo "required tests passed (full matrix): $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$RUN"
      - name: Run every suite (packaging-only dry run has no tag-triggered matrix)
        if: steps.decide.outputs.writes != 'true'
        run: python tests/run_all.py --jobs 4

  # ---- 3. portable ZIP ----------------------------------------------------
  # The green package ships a Windows runtime and the launchers start it as
  # python\python.exe, so it is assembled and booted on Windows. Building it on
  # Linux could only ever produce the source archive this asset must not be.
  portable:
    name: portable zip
    needs: [version, gate]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the pinned runtime
        shell: pwsh
        run: |
          python release/portable_runtime.py info | Tee-Object -FilePath "$env:RUNNER_TEMP\runtime.env"
          Get-Content "$env:RUNNER_TEMP\runtime.env" >> $env:GITHUB_ENV
      - name: Fetch the runtime (pinned, checksummed)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Everything the job downloads or unpacks stays outside the checkout.
          $cache = Join-Path $env:RUNNER_TEMP 'runtime-cache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $out = Join-Path $cache $env:RUNTIME_ASSET
          curl.exe -fsSL --retry 3 --retry-all-errors -o $out $env:RUNTIME_URL
          if ($LASTEXITCODE -ne 0) { throw "运行时下载失败" }
          $got = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:RUNTIME_SHA256) {
            throw "运行时校验和不符：期望 $env:RUNTIME_SHA256，实际 $got"
          }
          $mb = [math]::Round((Get-Item $out).Length / 1MB, 1)
          Write-Host "runtime tarball ok: $env:RUNTIME_ASSET ($mb MB, sha256 $got)"
          "RUNTIME_TARBALL=$out" >> $env:GITHUB_ENV
      - name: Trim the runtime
        shell: pwsh
        run: python release/portable_runtime.py prepare --tarball "$env:RUNTIME_TARBALL" --dest python
      - name: Build the portable archive
        shell: pwsh
        run: |
          python release/release_tools.py portable `
            --version "${{ needs.version.outputs.version }}" `
            --tag "$env:TAG" `
            --runtime python `
            --out "dist/workbuddy2api-hub-v${{ needs.version.outputs.version }}.zip"
      - name: Boot the packaged runtime
        # Presence is not enough: the archive has to start the gateway with the
        # interpreter it carries, which is what a user double-clicks.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          $mb = [math]::Round($zip.Length / 1MB, 1)
          Write-Host "package: $($zip.Name) ($mb MB)"
          if ($zip.Length -lt 5MB) { throw "便携包只有 $mb MB，运行时没有进去" }

          # Unpack outside the checkout: the smoke test is not allowed to leave
          # anything behind in the repository.
          $stage = Join-Path $env:RUNNER_TEMP 'smoke'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip.FullName -DestinationPath $stage -Force
          if (-not (Test-Path (Join-Path $stage 'release-manifest.json'))) {
            throw "包内没有 release-manifest.json"
          }
          $root = Join-Path $stage 'wb-proxy'
          if (-not (Test-Path $root)) { throw "包内没有 wb-proxy/ 目录" }
          $py = Join-Path $root 'python\python.exe'
          if (-not (Test-Path $py)) { throw "包内没有 python\python.exe" }
          # 静默模式用 pythonw 起服务、用 console_tail.py 开日志窗口；两者
          # 缺一个，双击启动脚本就会「一闪而过」（#416）。
          if (-not (Test-Path (Join-Path $root 'python\pythonw.exe'))) {
            throw "包内没有 python\pythonw.exe（静默启动依赖它）"
          }
          if (-not (Test-Path (Join-Path $root 'console_tail.py'))) {
            throw "包内没有 console_tail.py（静默模式的日志窗口依赖它）"
          }

          # The launcher has to look exactly where the runtime is.
          $bat = Get-Content (Join-Path $root 'start-wb-proxy.bat') -Raw
          if ($bat -notmatch 'python\\python\.exe') { throw "启动脚本没有找 python\python.exe" }

          & $py --version
          if ($LASTEXITCODE -ne 0) { throw "包内运行时无法执行" }
          Push-Location $root
          try {
            & $py -c "import wb_proxy, wb_accounts, wb_pricing, wb_atrest, wb_webagent, wb_webtools, wb_scheduler, wb_tasks; print('app imports ok')"
            if ($LASTEXITCODE -ne 0) { throw "包内运行时跑不动应用模块" }
          } finally { Pop-Location }

          $outLog = Join-Path $env:RUNNER_TEMP 'smoke-out.log'
          $errLog = Join-Path $env:RUNNER_TEMP 'smoke-err.log'
          $proc = Start-Process -FilePath $py `
            -ArgumentList 'wb_proxy.py', '--host', '127.0.0.1', '--port', '8799' `
            -WorkingDirectory $root -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          try {
            $ok = $false
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $r = Invoke-WebRequest 'http://127.0.0.1:8799/health' -UseBasicParsing -TimeoutSec 3
                if ($r.StatusCode -eq 200) { $ok = $true; Write-Host "health: $($r.Content)"; break }
              } catch { }
            }
            if (-not $ok) {
              Write-Host "--- stdout ---"; Get-Content $outLog -ErrorAction SilentlyContinue
              Write-Host "--- stderr ---"; Get-Content $errLog -ErrorAction SilentlyContinue
              throw "便携包启动后 /health 没有响应"
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
          Write-Host "portable package boots with its own runtime: $($zip.Name)"
      - name: Keep the archive
        uses: actions/upload-artifact@v4
        with:
          name: portable-zip
          path: dist/*.zip
          if-no-files-found: error

  # ---- 4. OpenWrt .ipk + .apk ---------------------------------------------
  openwrt:
    name: openwrt packages
    needs: [version, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Build .ipk (opkg path, no SDK needed)
        run: sh wrt/openwrt/build-ipk.sh --app-src "$GITHUB_WORKSPACE"
      - name: Cache the OpenWrt SDK tarball
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: .sdk-cache
          key: ${{ env.SDK_TARBALL }}
      - name: Download the SDK (cache miss only)
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          mkdir -p .sdk-cache
          OUT=".sdk-cache/${SDK_TARBALL}"
          # The official host is sometimes unusably slow on runners, so try
          # mirrors and treat "slower than 200KB/s for 60s" as a stall.
          ok=0
          for base in \
            "https://downloads.openwrt.org/releases/${SDK_REL}/targets/x86/64" \
            "https://mirror2.openwrt.org/releases/${SDK_REL}/targets/x86/64" \
            "https://mirrors.tuna.tsinghua.edu.cn/openwrt/releases/${SDK_REL}/targets/x86/64" \
            "https://mirrors.ustc.edu.cn/openwrt/releases/${SDK_REL}/targets/x86/64"
          do
            echo "== mirror: ${base}"
            if curl -fL --retry 2 --retry-all-errors --connect-timeout 20 \
                 --max-time 1200 --speed-time 60 --speed-limit 204800 \
                 -o "$OUT" "${base}/${SDK_TARBALL}"; then
              ok=1; break
            fi
            echo "::warning::mirror failed or stalled, trying the next one"
            rm -f "$OUT"
          done
          [ "$ok" = "1" ] || { echo "::error::no mirror served ${SDK_TARBALL}"; exit 1; }
          ls -l "$OUT"
      - name: Extract the SDK
        run: |
          set -eu
          command -v zstd >/dev/null 2>&1 || { sudo apt-get update; sudo apt-get install -y zstd; }
          mkdir -p "$RUNNER_TEMP/sdk"
          tar --zstd -xf ".sdk-cache/${SDK_TARBALL}" -C "$RUNNER_TEMP/sdk"
          SDK_DIR=$(find "$RUNNER_TEMP/sdk" -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n1)
          [ -f "$SDK_DIR/rules.mk" ] || { echo "::error::unexpected SDK layout: $SDK_DIR"; exit 1; }
          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"
          echo "SDK ok: $SDK_DIR"
      - name: Build .apk (apk-tools path, OpenWrt 25.x+)
        run: sh wrt/openwrt/build-apk.sh "$SDK_DIR" "$GITHUB_WORKSPACE"
      - name: Verify both packages against the tag
        # The .ipk packer self-checks its own structure while it builds (GNU tar
        # members, control fields, reproducible mtime). The .apk is checked here
        # with the SDK's own apk, so a package cannot be uploaded under a version
        # that only its file name claims.
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          R="${{ needs.version.outputs.release }}"
          IPK="wrt/ipk/workbuddy2api_${V}-${R}_all.ipk"
          APK="wrt/apk/workbuddy2api-${V}-r${R}.apk"
          for f in "$IPK" "$APK"; do
            [ -s "$f" ] || { echo "::error::资产为空或不存在：$f"; exit 1; }
          done
          APK_BIN="$SDK_DIR/staging_dir/host/bin/apk"
          [ -x "$APK_BIN" ] || { echo "::error::SDK 里没有 apk 工具：$APK_BIN"; exit 1; }
          "$APK_BIN" adbdump "$APK" | tee apk-dump.txt
          grep -q "${V}-r${R}" apk-dump.txt \
            || { echo "::error::.apk 元数据里的版本与 tag 不一致（期望 ${V}-r${R}）"; exit 1; }
          grep -q 'python3-light' apk-dump.txt \
            || { echo "::error::.apk 缺少 python3-light 依赖"; exit 1; }
          ls -l "$IPK" "$APK"
      - name: Stage both packages flat
        # download-artifact rebuilds the tree relative to the upload root, so
        # uploading wrt/ipk/*.ipk and wrt/apk/*.apk together lands them in
        # dist/ipk/ and dist/apk/ and the draft job's dist/*.apk glob finds
        # nothing. Everything is uploaded from one flat directory instead.
        run: |
          set -eu
          mkdir -p dist
          cp wrt/ipk/*.ipk wrt/apk/*.apk dist/
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-packages
          path: dist/*
          if-no-files-found: error

  # ---- 5. checksums + preview ---------------------------------------------
  # Runs for a tag push *and* for a manual packaging run. It reads releases
  # (to keep the maintainer's notes) but never writes one: everything it
  # produces goes into an artifact for the writer below, or to the log.
  # The Rust backend is an optional second implementation of the same gateway.
  # It is built here, never committed: a 10 MB binary in git would bloat every
  # clone and could not be reproduced from source.
  rust:
    name: rust backend binary
    needs: [version, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wb-backend
      - name: musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build the static binary
        env:
          # 让二进制的 `--version` / `/health.version` 与 release tag 一致。
          WB_BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cargo build --release --target x86_64-unknown-linux-musl \
            --manifest-path wb-backend/Cargo.toml
          mkdir -p dist
          install -m755 wb-backend/target/x86_64-unknown-linux-musl/release/wb-backend \
            "dist/wb-backend-${{ needs.version.outputs.version }}-linux-x86_64"
      - name: The binary must report this release's version
        run: |
          set -euo pipefail
          BIN="dist/wb-backend-${{ needs.version.outputs.version }}-linux-x86_64"
          "$BIN" --version
          "$BIN" --version | grep -F -- "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-backend
          path: dist/wb-backend-*
          if-no-files-found: error

  draft-preview:
    name: draft preview
    needs: [version, gate, portable, openwrt, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS from the final assets
        run: |
          set -euo pipefail
          ls -lR dist
          assets=()
          for pat in 'dist/*.zip' 'dist/*.ipk' 'dist/*.apk' \
                     'dist/wb-backend-*-linux-x86_64'; do
            found=0
            for f in $pat; do
              [ -f "$f" ] || continue
              assets+=("$f")
              found=1
            done
            [ "$found" = "1" ] || { echo "::error::缺少资产：$pat"; exit 1; }
          done
          python release/release_tools.py checksums --out dist/SHA256SUMS "${assets[@]}"
          echo "--- SHA256SUMS ---"
          cat dist/SHA256SUMS
      - name: Compose the release body (maintainer notes above the fixed block)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A re-run must keep whatever the maintainer already wrote above the
          # marker, so read the current body back first. Both scratch files live
          # under dist/ so the checkout stays clean.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release view "$TAG" --json body --jq .body > dist/existing-body.md
          else
            : > dist/existing-body.md
          fi
          python release/release_tools.py body \
            --version "${{ needs.version.outputs.version }}" \
            --release "${{ needs.version.outputs.release }}" \
            --existing dist/existing-body.md --out dist/release-body.md
          cat dist/release-body.md
      - name: Show what a tag push would do
        # A manual run stops here on purpose. The commands are printed, not
        # run: reaching the writer takes a v* tag.
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          echo "手动运行到此为止：不会创建或改动任何 release。推送 $TAG 时会执行："
          echo "  1) 校验 tag / 源码 / wrt Makefile 三处版本一致"
          echo "  2) 等目标提交上的完整矩阵（Ubuntu 3.9 + Ubuntu 3.12 + Windows 3.12）全绿"
          echo "  3) 创建或更新 Draft Release（--draft，永不 publish）并上传 dist/ 下的资产"
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            dist/SHA256SUMS
            dist/release-body.md
          if-no-files-found: error

  # ---- 6. the only release writer -----------------------------------------
  # The single condition under which a GitHub Release may be created, edited or
  # uploaded to. `workflow_dispatch` cannot satisfy it - its ref is a branch and
  # its event is not `push` - so no input combination reaches this job.
  # tests/_test_release_assets.py pins that, and proves the check has teeth.
  write-draft:
    name: write draft release
    needs: [version, gate, draft-preview]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Refuse to write a release without the full matrix
        # Belt and braces next to the gate job: the requirement is stated where
        # the mutation happens, so no later reshuffle of `needs` can drop it.
        run: |
          set -euo pipefail
          if [ "${{ needs.gate.outputs.matrix }}" != "full" ]; then
            echo "::error::没有完整矩阵的授权（gate.matrix='${{ needs.gate.outputs.matrix }}'），拒绝创建/更新 Draft Release"
            exit 1
          fi
          echo "full matrix confirmed for ${{ github.sha }}"
      - name: Verify the checksums against the assets about to be uploaded
        # The list has to describe the final artifacts, so it is checked here
        # against the files this job just downloaded rather than trusted.
        run: |
          set -euo pipefail
          ls -l dist
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Create or update the Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 标题就是 tag 本身（与 v1.4.5 ~ v1.6.18 那批历史 release 一致）；
          # 演练版本在标题上标一下，资产里没有别的痕迹。
          TITLE="$TAG"
          FLAGS=""
          if [ "${{ needs.version.outputs.rehearsal }}" = "true" ]; then
            # A rehearsal draft is marked prerelease as well, so even a mistaken
            # publish cannot be picked up by #29's updater.
            TITLE="$TAG（演练）"
            FLAGS="--prerelease"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::$TAG 已经是一个已发布的 release，本工作流不碰它"
              exit 1
            fi
            gh release edit "$TAG" --draft $FLAGS --title "$TITLE" --notes-file dist/release-body.md
          else
            gh release create "$TAG" --draft $FLAGS --title "$TITLE" --notes-file dist/release-body.md
          fi
          gh release upload "$TAG" dist/*.zip dist/*.ipk dist/*.apk \
            dist/wb-backend-*-linux-x86_64 dist/SHA256SUMS --clobber
      - name: Prove the release is still a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json isDraft,isPrerelease,assets \
            --jq '"draft=\(.isDraft) prerelease=\(.isPrerelease)", (.assets[].name)'
          [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ] \
            || { echo "::error::$TAG 不是 draft，立即停止"; exit 1; }
          for want in workbuddy2api-hub-v${{ needs.version.outputs.version }}.zip \
                      workbuddy2api_${{ needs.version.outputs.version }}-${{ needs.version.outputs.release }}_all.ipk \
                      workbuddy2api-${{ needs.version.outputs.version }}-r${{ needs.version.outputs.release }}.apk \
                      wb-backend-${{ needs.version.outputs.version }}-linux-x86_64 \
                      SHA256SUMS; do
            gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$want" \
              || { echo "::error::draft 里缺少资产 $want"; exit 1; }
          done
          echo "draft ok：$GITHUB_SERVER_URL/$GH_REPO/releases — 等维护者写说明后手动 Publish"
