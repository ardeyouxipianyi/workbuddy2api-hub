name: tests

# Pushes are covered on main only; every other branch (and every pull request,
# including ones from forks) is covered by pull_request. Listing both events
# without the branch filter ran each update twice - two full windows + ubuntu
# matrices for the same commit.
on:
  push:
    branches: [main]
    # v* tags run the full matrix plus the tag == source version assertion
    # below, so a release cannot ship a tag that disagrees with the code.
    tags: ["v*"]
  pull_request:

# A second push to the same branch makes the first run pointless: cancel it
# instead of paying for two full matrices.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # run_all.py already bounds each suite; this is the backstop so a job that
    # hangs outside a suite cannot hold a runner for the default six hours.
    timeout-minutes: 20
    env:
      # Belt and braces next to run_all.py's own reconfigure: every Python
      # process in the job reads and writes utf-8 whatever the runner locale is.
      PYTHONUTF8: "1"
    strategy:
      # One failing version must not cancel the others: the point of the matrix
      # is to see which interpreter breaks.
      fail-fast: false
      matrix:
        include:
          # The README advertises Python 3.9+, so the floor is exercised on
          # Linux; the primary platform (Windows) runs the current release.
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run every suite
        # The suites are independent processes (own temp dirs, spare ports), so
        # they overlap; each one's full output is kept on disk next to its
        # summary line.
        run: python tests/run_all.py --jobs 4 --logs suite-logs
      - name: Check the suites left the checkout clean
        # A passing run has to prove it stayed inside its temporary directories:
        # a suite that writes into the checkout otherwise fails nothing and is
        # only noticed by whoever finds the stray file later.
        #
        # `success()` is what a step does by default, but the ordering is the
        # point here - a red suite step must stay the reported failure, so this
        # one is skipped rather than stacked on top of it.
        if: success()
        run: python scripts/check_clean_checkout.py
      - name: Keep what the failing suites printed
        # The console shows one line per suite plus its first error; this keeps
        # the whole output of every suite, which is what a red run needs.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: suite-logs-${{ matrix.os }}-${{ matrix.python }}
          path: suite-logs
          if-no-files-found: ignore

  # Release discipline: a v* tag must match the version baked into
  # wb_proxy.py, and the two source version strings must agree with each
  # other. A tag carrying a -ci suffix is a rehearsal and skips only the tag
  # comparison (the source-consistency check still runs).
  version-assert:
    name: tag matches source version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert tag == source version
        run: |
          set -euo pipefail
          OVERVIEW=$(grep -oP '"version"\s*:\s*"\K[^"]+' wb_proxy.py | head -n1 || true)
          SERVER=$(grep -oP 'server_version\s*=\s*"wb-proxy/\K[^"]+' wb_proxy.py | head -n1 || true)
          echo "source: overview=$OVERVIEW server=$SERVER tag=$GITHUB_REF_NAME"
          if [ -z "$OVERVIEW" ] || [ "$OVERVIEW" != "$SERVER" ]; then
            echo "::error::source version strings disagree ($OVERVIEW vs $SERVER)"
            exit 1
          fi
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" == *-ci ]]; then
            echo "rehearsal tag (-ci): skipping tag==version assertion (source=$OVERVIEW)"
          elif [ "$TAG" != "$OVERVIEW" ]; then
            echo "::error::tag $GITHUB_REF_NAME != source version $OVERVIEW (bump the source first)"
            exit 1
          else
            echo "version assert OK: $TAG"
          fi
